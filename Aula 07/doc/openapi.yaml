components:
  schemas:
    Filme:
      required:
        - nome
        - data_lancamento
        - duracao
        - sinopse
        - valor

      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        data_lancamento:
          type: string
          format: date
        duracao:
          type: string
          format: time
        sinopse:
          type: string
        avaliacao:
          type: number
        valor:
          type: number
        capa:
          type: string

    ClassificacaoIndicativa:
      required:
        - codigo
        - nome
        - descricao

      type: object
      properties:
        id:
          type: integer
        codigo:
          type: string
        nome:
          type: string
        descricao:
          type: string

    Genero:
      required:
        - nome

      type: object
      properties:
        id:
          type: integer
        nome:
          type: string

    Elenco:
      required:
        - nome

      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        data_nascimento:
          type: string
          format: date

    Nacionalidade:
      required:
        - nome

      type: object
      properties:
        id:
          type: integer
        nome:
          type: string

    Atividades:
      required:
        - nome

      type: object
      properties:
        id:
          type: integer
        nome:
          type: string

    NomeArtistico:

      type: object
      properties:
        id:
          type: integer
        nome:
          type: string

    Biografia:

      type: object
      properties:
        id:
          type: integer
        texto:
          type: string

  requestBodies:
    Filme:
      description: Objeto Filme
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Filme'

    ClassificacaoIndicativa:
      description: Objeto Classificação Indicativa
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClassificacaoIndicativa'

