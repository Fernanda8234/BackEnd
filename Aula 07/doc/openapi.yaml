# shift + alt + p
openapi: 3.0.3
info:
  title: Projeto de Filmes - SENAI Jandira 
  description: API destinada para controlar filmes
  termsOfService: http://swagger.io/terms/
  version: 1.0.0
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
  - url: http://
paths:

#------------------[ inserir e listar filme ]-------------------#
  /v1/senai/locadora/filme:
    post:
      tags:
        - Filme
      summary: Adiciona um novo filme
      description: Adiciona um novo filme no Banco de Dados
      requestBody:
        description: Registra um filme
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Filme'
        required: true
      responses:
        '201':
          description: Registro inserido com sucesso
        '415':
          description: Não foi possível processar a requisição, pois o formato de dados aceito pela API é somente JSON
        '500':
          description: Erro na Model ou Controller

    get:
      tags:
        - Filme
      summary: Lista todos os filmes
      description: Listagem de todos os filmes registrados no sistema
      responses:
        '200':
          description: Busca feita com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Filme'          
           
        '404':
          description: Não foi possível encontrar nenhum dado para retorno
        '500':
          description: Erro na Model ou Controller
#---------------------------------------------------------------#

#----------[ ver, atualizar e deletar filme pelo ID ]-----------#
  /v1/senai/locadora/filme/{id}:
    get:
      tags:
        - Filme
      summary: Busca um filme pelo seu ID
      description: Retorna um filme pelo ID
      parameters:
        - name: id
          in: path
          description: Retorna um filme pelo seu ID
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Busca feita com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filme'          
        '400':
          description: Os dados enviados na requisição não estão corretos
        '404':
          description: Não foi possível encontrar nenhum dado para retorno
        '500':
          description: Erro na Model ou Controller

    put:
      tags:
        - Filme
      summary: Atualizar um filme existente pelo ID
      description: Localizar e atualizar um filme buscando pelo ID
      parameters:
        - name: id
          in: path
          description: ID para localizar e atualizar o filme
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Dados para atualizar o filme
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Filme'
        required: true
      responses:
        '200':
          description: Registro atualizado com sucesso
        '400':
          description: Os dados enviados na requisição não estão corretos
        '404':
          description: Não foi possível encontrar nenhum dado para retorno
        '415':
          description: Não foi possível processar a requisição, pois o formato de dados aceito pela API é somente JSON
        '500':
          description: Erro na Model ou Controller
       
    delete:
      tags:
        - Filme
      summary: Excluir um filme existente pelo ID
      description: Excluir um filme pelo ID
      parameters:
        - name: id
          in: path
          description: ID para localizar e excluir o filme
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Registro excluído com sucesso
        '400':
          description: Os dados enviados na requisição não estão corretos
        '404':
          description: Não foi possível encontrar nenhum dado para retorno
        '500':
          description: Erro na Model ou Controller
#---------------------------------------------------------------#
 
